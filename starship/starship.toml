format = """
[](#00ff41)\
$os\
$username\
[](bg:#39ff14 fg:#00ff41)\
$directory\
[](fg:#39ff14 bg:#00cc00)\
$git_branch\
$git_status\
[](fg:#00cc00 bg:#008f11)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:#008f11 bg:#003b00)\
$docker_context\
$conda\
[](fg:#003b00 bg:#001a00)\
$time\
[ ](fg:#001a00)\
$line_break$character"""

[os]
disabled = false
style = "bg:#00ff41 fg:#000000"

[username]
show_always = true
style_user = "bg:#00ff41 fg:#000000"
style_root = "bg:#00ff41 fg:#ff0000"
format = '[$user ]($style)'

[directory]
style = "bg:#39ff14 fg:#000000"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bg:#00cc00 fg:#000000"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#00cc00 fg:#000000"
format = '[$all_status$ahead_behind ]($style)'

[c]
symbol = " "
style = "bg:#008f11 fg:#00ff00"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#008f11 fg:#00ff00"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = ""
style = "bg:#008f11 fg:#00ff00"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#008f11 fg:#00ff00"
format = '[ $symbol ($version) ]($style)'

[php]
symbol = ""
style = "bg:#008f11 fg:#00ff00"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#008f11 fg:#00ff00"
format = '[ $symbol ($version) ]($style)'

[kotlin]
symbol = ""
style = "bg:#008f11 fg:#00ff00"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = ""
style = "bg:#008f11 fg:#00ff00"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = ""
style = "bg:#008f11 fg:#00ff00"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = ""
style = "bg:#003b00 fg:#00ff41"
format = '[ $symbol $context ]($style)'

[conda]
style = "bg:#003b00 fg:#00ff41"
format = '[ $symbol $environment ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#001a00 fg:#00ff41"
format = '[  $time ]($style)'

[character]
success_symbol = "[❯](bold #00ff00)"
error_symbol = "[❯](bold #ff0000)"
