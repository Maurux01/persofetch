# ==========================================
# Tmux Hacker Configuration
# ==========================================

# --- General Settings ---
set -g default-terminal "tmux-256color"
set -g history-limit 10000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -sg escape-time 0

# --- Prefix Key ---
# Changed to Ctrl+a for a classic hacker/sysadmin feel
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Colors (Matrix/Hacker Green) ---
set -g status-style "bg=black,fg=green"
set -g pane-border-style "fg=green,bg=black"
set -g pane-active-border-style "fg=brightgreen,bg=black"
set -g message-style "bg=black,fg=brightgreen,bold"
set -g message-command-style "bg=black,fg=brightgreen,bold"

# --- Status Bar ---
set -g status-position top
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60

# Status Left (Session Name)
set -g status-left-style "bg=green,fg=black,bold"
set -g status-left " #[bold] #S "

# Status Center (Windows)
set -g window-status-format " #I:#W "
set -g window-status-current-format " #[bold,bg=black,fg=brightgreen] #I:#W "
set -g window-status-style "fg=green,bg=black"
set -g window-status-current-style "fg=brightgreen,bg=black,bold"

# Status Right (Time and Date)
set -g status-right-style "bg=green,fg=black,bold"
set -g status-right " #[bold] %H:%M %d-%b "

# --- Vim-like Keybindings ---
# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane splitting (opens in same directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane resizing (hold prefix and press key to repeat)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Reload Config ---
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum settings (auto-save sessions)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
