# --- Green hacker style ---
# Kitty es la terminal por defecto: fastfetch usa aquí el protocolo
# de gráficos kitty para mostrar png/gif (animado) y thumbnails de video.
# No requiere opción especial: el protocolo kitty viene activado.
# Ver: randomizer.sh -> fastfetch --logo-type kitty --logo <png|gif>

# Colors
foreground              #00FF00
background              #000000
background_opacity  0.8

# Images / graphics (defaults, explícitos para claridad)
clear_all_on_display    no
allow_hyperlinks        yes

# Cursor
cursor_shape            block
cursor_blink            yes
cursor_text_color       #000000

# Font
font_family             monospace
font_size               14.0

# window
window_padding_width    10
